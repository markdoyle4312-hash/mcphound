services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mcphound
      POSTGRES_PASSWORD: mcphound
      POSTGRES_DB: mcphound_dev
    ports:
      - "5432:5432"
    volumes:
      - mcphound_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcphound"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mcphound_pgdata:
