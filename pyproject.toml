[project]
name = "mcphound"
version = "0.1.2"
description = "Independent security scanner and reputation layer for MCP servers and agent skills"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "marky-dooda08", email = "mark.doyle4312@gmail.com" }]
keywords = ["mcp", "security", "supply-chain", "ai-agents", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.0",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/markdoyle4312-hash/mcphound"
Repository = "https://github.com/markdoyle4312-hash/mcphound"
Issues = "https://github.com/markdoyle4312-hash/mcphound/issues"
Changelog = "https://github.com/markdoyle4312-hash/mcphound/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pre-commit>=3.8",
]
registry = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "slowapi>=0.1.9",
]

[project.scripts]
mcphound = "mcphound.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcphound"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()-as-default-argument is the framework's own required
# pattern, not the mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
