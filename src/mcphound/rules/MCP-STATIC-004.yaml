id: MCP-STATIC-004
title: Unpinned or @latest package version in launch command
owasp: AST04          # Supply chain: malicious/unsigned tooling
phase: static
severity: medium
confidence: medium
description: >
  An npx/uvx launch command references a package with no version pin (or the
  mutable "@latest" tag), or a "docker run" launch command references an
  image with no tag (implicit ":latest") or a floating, non-semver tag. The
  exact code that runs can change between invocations without review — the
  same rug-pull risk class as unsigned install scripts, just via registry
  mutation instead of a script. A digest-pinned image ("@sha256:...") or an
  explicit numeric version tag is not flagged.
detect:
  target: command
  pattern: '(?i)\b(?:npx|uvx|uv\s+run)\s+(?:-y\s+|--from\s+|--with\s+)?(?P<pkg>@?[\w][\w./-]*)(?!\S*@\d)'
  also: oci_pin   # docker run <image> with no tag, or a non-semver floating tag
recommendation: Pin an exact version, e.g. "npx -y pkg@1.2.3" or "docker run image:1.2.3" (or "image@sha256:..." for a digest pin); bump deliberately and note the bump in the commit message.
references:
  - https://labs.cloudsecurityalliance.org/research/csa-research-note-mcp-tool-poisoning-auto-execution-20260701/
