id: MCP-STATIC-001
title: Hardcoded secret in MCP server environment
owasp: LLM02          # Sensitive Information Disclosure
phase: static
severity: high
confidence: high
description: >
  A literal credential/token appears in an MCP server env block. Committed
  credentials leak through git, CI logs, and shared machine configs. Use
  environment variable expansion (${VAR}) instead.
detect:
  target: env
  pattern: '(?i)(api[_-]?key|secret|token|password)\s*[=:]\s*["'']?(sk-[a-z0-9]{12,}|xox[baprs]-[a-z0-9-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|[A-Za-z0-9]{32,})'
  allow_if: '${'          # ${ENV_VAR} expansion is the allowed pattern
recommendation: Replace with "${VAR}" expansion; rotate the leaked credential; add gitleaks.
references:
  - https://www.owasp.org/index.php/OWASP_Top_10_for_LLM_Applications
