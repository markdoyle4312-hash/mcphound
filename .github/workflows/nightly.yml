name: Nightly registry scan

on:
  schedule:
    - cron: "0 18 * * *"  # daily ~04:30 Adelaide time
  workflow_dispatch: {}

jobs:
  nightly-registry-scan:
    runs-on: ubuntu-latest
    env:
      MCPHOUND_DATABASE_URL: ${{ secrets.MCPHOUND_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run mcphound registry-poll --config config/registry.yaml
      - run: uv run mcphound registry-scan --config config/registry.yaml
      - run: uv run mcphound registry-export --config config/registry.yaml --out site/data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build static site
        working-directory: site
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy out --project-name=mcphound --branch=main
