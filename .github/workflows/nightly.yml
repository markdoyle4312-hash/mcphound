name: Nightly registry scan

on:
  schedule:
    - cron: "0 18 * * *"  # daily ~04:30 Adelaide time
  workflow_dispatch: {}

jobs:
  nightly-registry-scan:
    runs-on: ubuntu-latest
    env:
      MCPHOUND_DATABASE_URL: ${{ secrets.MCPHOUND_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run mcphound registry-poll --config config/registry.yaml
      - run: uv run mcphound registry-scan --config config/registry.yaml
      - run: uv run mcphound registry-export --config config/registry.yaml --out site/data
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build static site
        working-directory: site
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy out --project-name=mcphound --branch=main
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label nightly-scan-failure --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Nightly registry scan failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Nightly registry scan failed" \
              --label nightly-scan-failure \
              --body $'The scheduled nightly-registry-scan workflow failed: '"$RUN_URL"$'\n\nThis issue stays open and gets a new comment on each subsequent failure; close it once the underlying cause is fixed.'
          fi
