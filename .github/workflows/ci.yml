name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/mcphound
      - name: Tests
        run: uv run pytest -q
      - name: SARIF output smoke test
        run: uv run mcphound scan tests/fixtures/configs/*.json --sarif -o mcphound-results.sarif
      - name: Upload SARIF (works once findings exist)
        if: hashFiles('mcphound-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: mcphound-results.sarif

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dogfood the scanner on our own agent configs
        run: |
          uv sync
          uv run mcphound scan --self --fail-on high --json

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify docs/rules.md matches src/mcphound/rules/*.yaml
        run: |
          uv sync
          uv run python scripts/generate_rule_docs.py
          git diff --exit-code docs/rules.md

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcphound
          POSTGRES_PASSWORD: mcphound
          POSTGRES_DB: mcphound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcphound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      MCPHOUND_DATABASE_URL: postgresql+psycopg://mcphound:mcphound@localhost:5432/mcphound_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: DB-backed tests (runs Alembic migrations via the test fixture)
        run: uv run pytest tests/db tests/registry tests/api -q

  site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Populate sample data for the build smoke test
        run: npm run prepare:sample-data
      - name: Build (static export)
        run: npm run build
