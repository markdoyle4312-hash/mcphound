name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: SARIF output smoke test
        run: uv run mcphound scan tests/fixtures --sarif -o mcphound-results.sarif || true
      - name: Upload SARIF (works once findings exist)
        if: hashFiles('mcphound-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mcphound-results.sarif

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dogfood the scanner on our own agent configs
        run: |
          uv sync
          uv run mcphound scan --self --fail-on high --json

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify docs/rules.md matches src/mcphound/rules/*.yaml
        run: |
          uv sync
          uv run python scripts/generate_rule_docs.py
          git diff --exit-code docs/rules.md

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcphound
          POSTGRES_PASSWORD: mcphound
          POSTGRES_DB: mcphound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcphound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      MCPHOUND_DATABASE_URL: postgresql+psycopg://mcphound:mcphound@localhost:5432/mcphound_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: DB-backed tests (runs Alembic migrations via the test fixture)
        run: uv run pytest tests/db tests/registry tests/api -q

  site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Populate sample data for the build smoke test
        run: npm run prepare:sample-data
      - name: Build (static export)
        run: npm run build
